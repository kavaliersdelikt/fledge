# Local evaluation stack only. For hosting customers, use managed PostgreSQL, HTTPS,
# reverse proxy, off-node S3 and a real two-node validation before launch.
services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-fledge-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-development-only}
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3_data:/data
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fledge
      POSTGRES_USER: fledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fledge -d fledge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://fledge:${POSTGRES_PASSWORD}@postgres:5432/fledge
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PORT: "4000"
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.7}
      UPDATER_URL: http://updater:4010
      UPDATE_TOKEN_FILE: /run/fledge-updater/token
      GITHUB_REPOSITORY: kavaliersdelikt/fledge
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      ALLOWED_IMAGE_PREFIXES: ${ALLOWED_IMAGE_PREFIXES:-itzg/minecraft-server:,ghcr.io/lloesche/valheim-server:}
    ports:
      - "${API_BIND:-127.0.0.1}:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - update_credentials:/run/fledge-updater
    restart: unless-stopped
  updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    environment:
      PORT: "4010"
      UPDATE_TOKEN_FILE: /run/fledge-updater/token
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - update_credentials:/run/fledge-updater:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_GITHUB_REPOSITORY: ${NEXT_PUBLIC_GITHUB_REPOSITORY:-}
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
  s3_data:
  update_credentials:
