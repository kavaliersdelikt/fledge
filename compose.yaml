# Local evaluation stack only. For hosting customers, use managed PostgreSQL, HTTPS,
# reverse proxy, off-node S3 and a real two-node validation before launch.
services:
  # Optional bundled S3 for evaluation only: `docker compose --profile bundled-s3 up -d`.
  # Then enter http://<this host>:9000 and the keys below in Settings → Object storage.
  s3:
    profiles: ["bundled-s3"]
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-fledge-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-development-only}
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3_data:/data
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fledge
      POSTGRES_USER: fledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fledge -d fledge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://fledge:${POSTGRES_PASSWORD}@postgres:5432/fledge
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PORT: "4000"
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.6.2.1}
      # Appearance (Settings, Appearance): BRANDING_DISABLED=true shows the built-in look and refuses changes (recovery).
      BRANDING_DISABLED: ${BRANDING_DISABLED:-false}
      BRAND_NAME: ${BRAND_NAME:-}
      UPDATER_URL: http://updater:4010
      PLUGIN_HOST_URL: http://plugins:4020
      PLUGIN_TOKEN_FILE: /run/fledge-plugins/token
      UPDATE_TOKEN_FILE: /run/fledge-updater/token
      TRANSFER_DIR: /var/lib/fledge/transfers
      # Storage, SFTP, allowed images, update source and agent updates are managed in
      # the panel (Settings). The values below only seed first start and are optional.
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-kavaliersdelikt/fledge}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PLUGIN_REGISTRY_URL: ${PLUGIN_REGISTRY_URL-https://raw.githubusercontent.com/kavaliersdelikt/fledge/main/plugins/registry/index.json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      ADMIN_IP_ALLOW_DISABLE: ${ADMIN_IP_ALLOW_DISABLE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      ALLOWED_IMAGE_PREFIXES: ${ALLOWED_IMAGE_PREFIXES:-itzg/minecraft-server:,itzg/minecraft-bedrock-server:,ghcr.io/lloesche/valheim-server:,node:,python:,oven/bun:,golang:,eclipse-temurin:,php:,ruby:,mcr.microsoft.com/dotnet/}
    ports:
      - "${API_BIND:-127.0.0.1}:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      # Started with the API (also by older update scripts that only name api and web), but
      # the panel works without it: plugins are simply unavailable while it is down.
      plugins:
        condition: service_started
        required: false
    networks:
      - default
      - plugins_net
    volumes:
      - update_credentials:/run/fledge-updater
      - transfer_spool:/var/lib/fledge/transfers
      - plugin_credentials:/run/fledge-plugins
    restart: unless-stopped
  # Runs plugin code in a WebAssembly sandbox. It has no database credentials, no Docker
  # socket and no published port: only the API can call it, using a shared token.
  plugins:
    build:
      context: .
      dockerfile: plugins/host/Dockerfile
    environment:
      PORT: "4020"
      PLUGIN_TOKEN_FILE: /run/fledge-plugins/token
      APP_VERSION: ${APP_VERSION:-0.6.2.1}
    networks:
      - plugins_net
    volumes:
      - plugin_credentials:/run/fledge-plugins:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    environment:
      PORT: "4010"
      UPDATE_TOKEN_FILE: /run/fledge-updater/token
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - update_credentials:/run/fledge-updater:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_GITHUB_REPOSITORY: ${NEXT_PUBLIC_GITHUB_REPOSITORY:-}
    environment:
      # How the panel's server reaches the API to read the appearance settings (the browser uses NEXT_PUBLIC_API_URL).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
networks:
  # Shared by the API and the plugin host only (the database is not on it).
  plugins_net:
volumes:
  postgres_data:
  s3_data:
  transfer_spool:
  update_credentials:
  plugin_credentials:
